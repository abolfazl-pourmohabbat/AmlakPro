services:
  - type: web
    name: amlakpro-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    autoDeployTrigger: commit
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://amlak-pro.vercel.app"
      - key: DATABASE_URL
        fromDatabase:
          name: amlakpro-db
          property: connectionString

databases:
  - name: amlakpro-db
    plan: free
    region: singapore
    postgresMajorVersion: "17"
    databaseName: amlakpro
