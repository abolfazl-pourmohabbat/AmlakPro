<section class="page-head"><span class="eyebrow dark">تیم ما</span><h1>مشاورانی که کنار شما هستند</h1><p>تخصص محلی، پاسخ‌گویی و همراهی تا پایان معامله.</p></section><section class="agents"><article *ngFor="let a of items"><div class="avatar" [style.backgroundImage]="a.image_url ? 'url('+a.image_url+')' : ''">{{a.image_url?'':'مشاور'}}</div><h3>{{a.name}}</h3><span>{{a.role}}</span><p>{{a.bio}}</p><a [href]="'tel:'+a.phone">{{a.phone}}</a></article><div *ngIf="!items.length" class="empty">هنوز مشاوری ثبت نشده است.</div></section>
